name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
 

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: studio_test
          POSTGRES_USER: studio
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studio -d studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://studio:test-only-password@127.0.0.1:5432/studio_test
      STUDIO_DATA_DIR: ${{ github.workspace }}/data/test
      STUDIO_PYTHON: ${{ github.workspace }}/.venv/bin/python
      TEST_REFERENCE_DATABASE: 1
      EVE_PASSWORD: ci-only-secret-not-used-by-any-live-service
      TEST_DATABASE: 1
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: bun install --frozen-lockfile







      - name: Install Python environments
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r blender/requirements.txt -r scripts/requirements-dev.txt
          python -m venv .venv-cad
          .venv-cad/bin/python -m pip install -r cad/requirements.txt


      - name: Apply database migrations
        run: |
          bun run db:migrate

      - name: Verify
        run: |
          bun run verify

      - name: Build demo
        run: |
          bun run build:demo

      - name: Build Eve
        run: |
          bun run eve:build

      - name: Audit dependencies
        run: |
          bun run audit

      - name: Lint Python
        run: |
          .venv/bin/ruff check blender scripts cad

      - name: Test CAD
        run: |
          .venv-cad/bin/python -m unittest cad.test_cad

      - name: Test Blender and service scripts
        run: |
          PYTHONPATH=blender .venv/bin/python -m unittest \
            blender.test_analyze_mesh blender.test_materials blender.test_material_quality \
            blender.test_build_artifacts blender.test_workspace blender.test_build_runtime \
            blender.test_cancellation scripts.test_provider scripts.test_services
