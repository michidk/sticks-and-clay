services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: studio_local
    ports: ["127.0.0.1:55439:5432"]
    volumes: ["studio-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio"]
      interval: 3s
      retries: 20
volumes:
  studio-db:
